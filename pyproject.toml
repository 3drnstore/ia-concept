[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyra"
version = "0.2.0"
description = "N.Y.R.A. — Neural Yielding Reasoning Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "psutil>=5.9,<8"
]

[project.scripts]
nyra = "nyra.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nyra = ["ui/**/*.qml", "assets/**/*"]
