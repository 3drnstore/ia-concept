name: Build Video Downloader APK

on:
  push:
    branches:
      - video-downloader-build
    paths:
      - 'video-downloader/**'
      - '.github/workflows/video-downloader-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: video-downloader
        run: gradle --stacktrace :app:assembleDebug

      - name: Prepare APK
        run: cp video-downloader/app/build/outputs/apk/debug/app-debug.apk VideoDownloader-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-v1.0.0
          path: VideoDownloader-v1.0.0.apk
          if-no-files-found: error
          retention-days: 14
