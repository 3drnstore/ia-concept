name: Build Video Downloader APK

on:
  push:
    branches:
      - video-downloader-build
    paths:
      - 'video-downloader/**'
      - '.github/workflows/video-downloader-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Inject modern Python and curl-cffi engine
        shell: bash
        run: |
          set -euo pipefail
          PY_APK=/tmp/ytdlnis-python-arm64.apk
          JNI_DIR=video-downloader/app/src/main/jniLibs/arm64-v8a
          RAW_DIR=video-downloader/app/src/main/res/raw

          mkdir -p "$JNI_DIR" "$RAW_DIR"

          # Python 3.14.6 package maintained for Android downloaders. The arm64
          # build contains curl-cffi, requests, brotli, websockets and certifi.
          curl -fL --retry 3 \
            'https://github.com/deniscerri/ytdlnis-packages/releases/download/python-3.14.6/app-arm64-v8a-release.apk' \
            -o "$PY_APK"

          unzip -j -o "$PY_APK" 'lib/arm64-v8a/libpython.so' -d "$JNI_DIR"
          unzip -j -o "$PY_APK" 'lib/arm64-v8a/libpython.zip.so' -d "$JNI_DIR"

          test -s "$JNI_DIR/libpython.so"
          test -s "$JNI_DIR/libpython.zip.so"

          sha256sum "$JNI_DIR/libpython.so" > /tmp/expected-python-launcher.sha256
          sha256sum "$JNI_DIR/libpython.zip.so" > /tmp/expected-python-bundle.sha256

          # Override the stale yt-dlp resource shipped by youtubedl-android.
          curl -fL --retry 3 \
            'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp' \
            -o "$RAW_DIR/ytdlp"
          test -s "$RAW_DIR/ytdlp"
          python3 "$RAW_DIR/ytdlp" --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: video-downloader
        run: gradle --stacktrace :app:assembleDebug

      - name: Validate advanced engine inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK=video-downloader/app/build/outputs/apk/debug/app-debug.apk
          SRC=video-downloader/app/src/main/jniLibs/arm64-v8a

          EXPECTED_LAUNCHER=$(sha256sum "$SRC/libpython.so" | awk '{print $1}')
          EXPECTED_BUNDLE=$(sha256sum "$SRC/libpython.zip.so" | awk '{print $1}')
          ACTUAL_LAUNCHER=$(unzip -p "$APK" lib/arm64-v8a/libpython.so | sha256sum | awk '{print $1}')
          ACTUAL_BUNDLE=$(unzip -p "$APK" lib/arm64-v8a/libpython.zip.so | sha256sum | awk '{print $1}')

          echo "Python launcher expected=$EXPECTED_LAUNCHER actual=$ACTUAL_LAUNCHER"
          echo "Python bundle   expected=$EXPECTED_BUNDLE actual=$ACTUAL_BUNDLE"

          test "$EXPECTED_LAUNCHER" = "$ACTUAL_LAUNCHER"
          test "$EXPECTED_BUNDLE" = "$ACTUAL_BUNDLE"

          # The curl-cffi package must actually be present in the Python bundle.
          unzip -p "$APK" lib/arm64-v8a/libpython.zip.so > /tmp/python-bundle.zip
          unzip -l /tmp/python-bundle.zip | grep -q 'curl_cffi'

      - name: Prepare APK
        run: cp video-downloader/app/build/outputs/apk/debug/app-debug.apk VideoDownloader-v1.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-v1.1.0
          path: VideoDownloader-v1.1.0.apk
          if-no-files-found: error
          retention-days: 14
