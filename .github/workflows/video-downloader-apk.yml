name: Build Video Downloader APK

on:
  push:
    branches:
      - video-downloader-build
    paths:
      - 'video-downloader/**'
      - '.github/workflows/video-downloader-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Inject modern Python and curl-cffi engine
        shell: bash
        run: |
          set -euo pipefail
          PY_APK=/tmp/ytdlnis-python-arm64.apk
          JNI_DIR=video-downloader/app/src/main/jniLibs/arm64-v8a
          RAW_DIR=video-downloader/app/src/main/res/raw

          mkdir -p "$JNI_DIR" "$RAW_DIR"

          curl -fL --retry 3 \
            'https://github.com/deniscerri/ytdlnis-packages/releases/download/python-3.14.6/app-arm64-v8a-release.apk' \
            -o "$PY_APK"

          unzip -j -o "$PY_APK" 'lib/arm64-v8a/libpython.so' -d "$JNI_DIR"
          unzip -j -o "$PY_APK" 'lib/arm64-v8a/libpython.zip.so' -d "$JNI_DIR"

          test -s "$JNI_DIR/libpython.so"
          test -s "$JNI_DIR/libpython.zip.so"

          curl -fL --retry 3 \
            'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp' \
            -o "$RAW_DIR/ytdlp"
          test -s "$RAW_DIR/ytdlp"
          python3 "$RAW_DIR/ytdlp" --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: video-downloader
        run: gradle --stacktrace :app:assembleRelease

      - name: Align and sign APK with v1 v2 v3
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED=video-downloader/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=/tmp/VideoDownloader-v1.1.1-aligned.apk
          KEYSTORE=/tmp/video-downloader.keystore
          FINAL=VideoDownloader-v1.1.1.apk

          test -s "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass videodownloader \
            -keypass videodownloader \
            -alias videodownloader \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Video Downloader,O=Local,C=BR'

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias videodownloader \
            --ks-pass pass:videodownloader \
            --key-pass pass:videodownloader \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$FINAL" \
            "$ALIGNED"

      - name: Validate APK package parsing and signatures
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK=VideoDownloader-v1.1.1.apk

          "$BUILD_TOOLS/zipalign" -c 4 "$APK"
          jarsigner -verify -verbose "$APK" | tee /tmp/jarsigner.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | tee /tmp/badging.txt

          grep -q 'jar verified' /tmp/jarsigner.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apksigner.txt
          grep -q "package: name='app.videodownloader.local'" /tmp/badging.txt
          grep -q "minSdkVersion:'24'" /tmp/badging.txt
          grep -q "targetSdkVersion:'28'" /tmp/badging.txt

      - name: Validate advanced engine inside final APK
        shell: bash
        run: |
          set -euo pipefail
          APK=VideoDownloader-v1.1.1.apk
          SRC=video-downloader/app/src/main/jniLibs/arm64-v8a

          EXPECTED_LAUNCHER=$(sha256sum "$SRC/libpython.so" | awk '{print $1}')
          EXPECTED_BUNDLE=$(sha256sum "$SRC/libpython.zip.so" | awk '{print $1}')
          ACTUAL_LAUNCHER=$(unzip -p "$APK" lib/arm64-v8a/libpython.so | sha256sum | awk '{print $1}')
          ACTUAL_BUNDLE=$(unzip -p "$APK" lib/arm64-v8a/libpython.zip.so | sha256sum | awk '{print $1}')

          echo "Python launcher expected=$EXPECTED_LAUNCHER actual=$ACTUAL_LAUNCHER"
          echo "Python bundle   expected=$EXPECTED_BUNDLE actual=$ACTUAL_BUNDLE"

          test "$EXPECTED_LAUNCHER" = "$ACTUAL_LAUNCHER"
          test "$EXPECTED_BUNDLE" = "$ACTUAL_BUNDLE"

          unzip -p "$APK" lib/arm64-v8a/libpython.zip.so > /tmp/python-bundle.zip
          unzip -l /tmp/python-bundle.zip | grep -q 'curl_cffi'

          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-v1.1.1
          path: VideoDownloader-v1.1.1.apk
          if-no-files-found: error
          retention-days: 14
