name: Build Nyra Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/fix-concept-qml.py'
      - 'pyproject.toml'
      - 'run_nyra.py'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
      - name: Repair ConceptShell QML
        run: python scripts/fix-concept-qml.py
      - name: Validate QML
        shell: pwsh
        run: pyside6-qmllint src/nyra/ui/ConceptShell.qml
      - name: Build Nyra
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name Nyra --icon "src/nyra/assets/nyra.ico" --add-data "src/nyra/ui;nyra/ui" run_nyra.py
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $readyFile = Join-Path $env:RUNNER_TEMP "nyra-qml-ready.txt"
          $stdoutFile = Join-Path $env:RUNNER_TEMP "nyra-stdout.txt"
          $stderrFile = Join-Path $env:RUNNER_TEMP "nyra-stderr.txt"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "NyraSmokeLocalAppData"
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $env:NYRA_SMOKE_TEST_READY_FILE = $readyFile
          $process = Start-Process -FilePath (Resolve-Path "dist/Nyra/Nyra.exe") -PassThru -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile

          try {
            $deadline = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $readyFile) -and -not $process.HasExited) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
            }

            if ($process.HasExited) {
              $stderr = if (Test-Path $stderrFile) { Get-Content $stderrFile -Raw } else { "" }
              throw "Nyra.exe exited during startup with code $($process.ExitCode). stderr: $stderr"
            }
            if (-not (Test-Path $readyFile)) {
              throw "Nyra.exe stayed alive but the initial QML window did not report ready within 20 seconds."
            }

            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited) {
              throw "Nyra.exe exited after its QML window initialized (code $($process.ExitCode))."
            }
            Write-Host "Nyra.exe is alive and its initial QML window loaded successfully."
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Package build
        shell: pwsh
        run: Compress-Archive -Path dist/Nyra/* -DestinationPath Nyra-0.2-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Nyra-0.2-Windows
          path: Nyra-0.2-Windows.zip
          if-no-files-found: error
