name: Build Nuwe Mapa Legacy APK

on:
  push:
    branches:
      - nuwe-mapa-build
    paths:
      - '.github/workflows/nuwe-mapa-legacy-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Nuwe patch files
        uses: actions/checkout@v7
        with:
          path: host
      - name: Checkout OsmAnd
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd
          path: android
      - name: Checkout OsmAnd resources
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-resources
          path: resources
      - name: Checkout OsmAnd core
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-core
          path: core
      - name: Checkout OsmAnd legacy core
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-core-legacy
          path: core-legacy
      - name: Checkout OsmAnd build support
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-build
          path: build
      - name: Checkout OsmAnd tools
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-tools
          path: tools
      - name: Checkout OsmAnd misc
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-misc
          path: misc
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: Install branding dependency
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Apply Nuwe Mapa patches
        run: python3 host/nuwe-mapa/patch_osmand.py android
      - name: Build legacy ARM64 APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          printf '\norg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8\n' >> gradle.properties
          ./gradlew :OsmAnd:assembleAndroidFullLegacyArm64Debug --stacktrace
      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p dist
          APK=$(find android/OsmAnd/build/outputs/apk -type f -name '*.apk' | sort | tail -n 1)
          test -n "$APK"
          cp "$APK" dist/Nuwe-Mapa-0.1.0-arm64-legacy-debug.apk
          printf 'androidFullLegacyArm64Debug\n' > dist/BUILD_VARIANT.txt
          cp android/NUWE_MAPA_BUILD_NOTICE.txt dist/NUWE_MAPA_BUILD_NOTICE.txt
          sha256sum dist/Nuwe-Mapa-0.1.0-arm64-legacy-debug.apk > dist/SHA256.txt
      - name: Archive Nuwe Mapa legacy APK
        uses: actions/upload-artifact@v7
        with:
          name: nuwe-mapa-legacy-apk
          path: dist/*
          retention-days: 30
          if-no-files-found: error
