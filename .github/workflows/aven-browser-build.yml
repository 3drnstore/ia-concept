name: Build Aven Browser APK

on:
  push:
    branches: [ aven-browser-build ]
    paths:
      - 'aven-browser/**'
      - '.github/workflows/aven-browser-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Embed uBlock Origin 1.72.2
        run: |
          set -euxo pipefail
          mkdir -p aven-browser/app/src/main/assets/ublock
          curl -fL --retry 3 -o /tmp/ublock.xpi https://github.com/gorhill/uBlock/releases/download/1.72.2/uBlock0_1.72.2.firefox.signed.xpi
          echo '40c315b0da7871868155ecfae7a50a58dfa0920aebd865e008214986f1b7c578  /tmp/ublock.xpi' | sha256sum -c -
          unzip -q /tmp/ublock.xpi -d aven-browser/app/src/main/assets/ublock
          test -f aven-browser/app/src/main/assets/ublock/manifest.json

      - name: Build debug APK
        working-directory: aven-browser
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp aven-browser/app/build/outputs/apk/debug/app-debug.apk Aven-1.0.0-debug.apk
          sha256sum Aven-1.0.0-debug.apk > Aven-1.0.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aven-APK
          path: |
            Aven-1.0.0-debug.apk
            Aven-1.0.0-debug.apk.sha256
          retention-days: 30
