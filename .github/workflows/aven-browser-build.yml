name: Build Aven Browser APK

on:
  push:
    branches: [ aven-browser-build ]
    paths:
      - 'aven-browser/**'
      - '.github/workflows/aven-browser-build.yml'
  workflow_dispatch:

concurrency:
  group: aven-browser-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Embed uBlock Origin 1.72.2
        run: |
          set -euxo pipefail
          mkdir -p aven-browser/app/src/main/assets/ublock
          curl -fL --retry 3 -o /tmp/ublock.xpi https://github.com/gorhill/uBlock/releases/download/1.72.2/uBlock0_1.72.2.firefox.signed.xpi
          echo '40c315b0da7871868155ecfae7a50a58dfa0920aebd865e008214986f1b7c578  /tmp/ublock.xpi' | sha256sum -c -
          unzip -q /tmp/ublock.xpi -d aven-browser/app/src/main/assets/ublock
          test -f aven-browser/app/src/main/assets/ublock/manifest.json

      - name: Validate bundled Aven media detector
        run: |
          set -euxo pipefail
          test -f aven-browser/app/src/main/assets/aven_media/manifest.json
          test -f aven-browser/app/src/main/assets/aven_media/background.js
          test -f aven-browser/app/src/main/assets/aven_media/content.js
          grep -q 'media-detector@aven.app' aven-browser/app/src/main/assets/aven_media/manifest.json

      - name: Apply Aven 1.2.2 UX patch
        run: |
          set -euxo pipefail
          python3 aven-browser/tools/patch_1_2_2.py
          grep -q 'showHistory' aven-browser/app/src/main/java/app/aven/browser/MainActivity.java
          grep -q 'TabCounterView' aven-browser/app/src/main/java/app/aven/browser/MainActivity.java
          grep -q 'WindowInsets.Type.ime' aven-browser/app/src/main/java/app/aven/browser/MainActivity.java
          grep -q 'android:windowSoftInputMode="adjustResize"' aven-browser/app/src/main/AndroidManifest.xml

      - name: Validate PT-BR interface
        run: |
          set -euxo pipefail
          SRC='aven-browser/app/src/main/java/app/aven/browser/MainActivity.java'
          grep -q 'Navegue livremente' "$SRC"
          grep -q 'Pesquisar ou digitar endereço' "$SRC"
          grep -q 'Privacidade e segurança' "$SRC"
          grep -q 'Downloader de vídeos' "$SRC"
          grep -q 'Histórico' "$SRC"
          grep -q 'Nova aba privativa' "$SRC"

      - name: Normalize fractional density helper
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('aven-browser/app/src/main/java/app/aven/browser/MainActivity.java')
          source = path.read_text(encoding='utf-8')
          marker = '    private int dp(int value) { return Math.round(value * getResources().getDisplayMetrics().density); }\n'
          overload = '    private float dp(float value) { return value * getResources().getDisplayMetrics().density; }\n'
          if overload not in source:
              if marker not in source:
                  raise SystemExit('dp(int) helper not found')
              source = source.replace(marker, marker + overload)
              path.write_text(source, encoding='utf-8')
          PY

      - name: Build unsigned release APK
        working-directory: aven-browser
        run: gradle --no-daemon assembleRelease

      - name: Prepare aligned unsigned APK for permanent signing
        run: |
          set -euxo pipefail
          INPUT='aven-browser/app/build/outputs/apk/release/app-release-unsigned.apk'
          OUTPUT='Aven-1.2.2-arm64-aligned-unsigned.apk'
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -s "$INPUT"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$INPUT" "$OUTPUT"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$OUTPUT"
          cp "$BUILD_TOOLS/lib/apksigner.jar" Aven-apksigner.jar
          test -s Aven-apksigner.jar

      - name: Verify unsigned package metadata and icon
        run: |
          set -euxo pipefail
          APK='Aven-1.2.2-arm64-aligned-unsigned.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/aven_media/manifest.json'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$APK" | grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo 'Unexpected non-ARM64 native library found' >&2
            exit 1
          fi
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          if [ -x "$BUILD_TOOLS/aapt" ]; then
            "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          else
            "$BUILD_TOOLS/aapt2" dump badging "$APK" | tee /tmp/badging.txt
          fi
          grep -q "package: name='app.aven.browser'" /tmp/badging.txt
          grep -q "application-label:'Aven'" /tmp/badging.txt
          grep -q 'application-icon-' /tmp/badging.txt
          grep -q "sdkVersion:'26'" /tmp/badging.txt
          grep -q "versionCode='5'" /tmp/badging.txt
          grep -q "versionName='1.2.2'" /tmp/badging.txt
          sha256sum "$APK" > Aven-1.2.2-arm64-aligned-unsigned.apk.sha256

      - name: Upload unsigned signing pack
        uses: actions/upload-artifact@v4
        with:
          name: Aven-1.2.2-Unsigned-Signing-Pack
          path: |
            Aven-1.2.2-arm64-aligned-unsigned.apk
            Aven-1.2.2-arm64-aligned-unsigned.apk.sha256
            Aven-apksigner.jar
          retention-days: 30
