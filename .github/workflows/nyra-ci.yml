name: Nyra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Compile Python
        run: python -m compileall -q src
      - name: Test audio and local AI
        run: python -m unittest discover -s tests -v
      - name: Test telemetry backend
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\nyra-test"
          python -c "from nyra.system_monitor import SystemMonitor; m=SystemMonitor(); assert 0 <= m.cpuPercent <= 100; assert 0 <= m.ramPercent <= 100; assert m.gpuPercent == -1 or 0 <= m.gpuPercent <= 100; print(m.gpuName, m.gpuStatus)"
      - name: Validate QML
        shell: pwsh
        run: |
          $qmllint = Get-Command pyside6-qmllint -ErrorAction SilentlyContinue
          if ($qmllint) {
            pyside6-qmllint src/nyra/ui/ConceptShell.qml src/nyra/ui/MicrophoneControl.qml src/nyra/ui/PrioritySelector.qml
          } else {
            Write-Error "pyside6-qmllint was not installed with PySide6"
          }
