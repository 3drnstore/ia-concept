plugins {
    id 'com.android.application'
}

android {
    namespace 'app.videodownloader.local'
    compileSdk 35

    defaultConfig {
        applicationId 'app.videodownloader.local'
        minSdk 24
        targetSdk 28
        versionCode 3
        versionName '1.1.1'

        // O motor avançado com curl-cffi atualmente está disponível para arm64.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Este APK é distribuído por sideload. O targetSdk 28 é mantido
    // deliberadamente porque o motor Python/curl-cffi precisa executar o
    // runtime extraído no armazenamento privado do app.
    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            // A build injeta Python 3.14 + curl-cffi por cima do Python antigo
            // trazido pela biblioteca youtubedl-android.
            pickFirsts += ['lib/arm64-v8a/libpython.so', 'lib/arm64-v8a/libpython.zip.so']
        }
    }
}

dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
