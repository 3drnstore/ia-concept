plugins {
    id 'com.android.application'
}

android {
    namespace 'app.aven.browser'
    // GeckoView 154 requires Android API 37.1 at compile time.
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId 'app.aven.browser'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.2.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:154.0.20260824154132'
}
