plugins {
    id 'com.android.application'
}

android {
    namespace 'app.aven.browser'
    compileSdk 36

    defaultConfig {
        applicationId 'app.aven.browser'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:154.0.20260824154132'
}
